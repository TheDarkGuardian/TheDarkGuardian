name: Refresh profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_stats.py'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate cards from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_stats.py
      - name: Save updated cards
        run: |
          git add assets/stats-dark.svg assets/stats-light.svg assets/stats.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile statistics"
          git push
